[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-relationships"
version = "0.2.1"
description = "Typed relationships between any NetBox objects, links NetBox already knows, a dependency graph, impact analysis and a layered service map."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Matti" }]
# No runtime dependencies beyond NetBox (which brings Django). NetBox
# versions are enforced at runtime by min_version in
# netbox_relationships/__init__.py.
dependencies = []
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/mattivaisanen/netbox-relationships"
Issues = "https://github.com/mattivaisanen/netbox-relationships/issues"
Changelog = "https://github.com/mattivaisanen/netbox-relationships/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["netbox_relationships*"]

[tool.setuptools.package-data]
netbox_relationships = [
    "templates/netbox_relationships/**/*.html",
    "assets/*",
]

[tool.ruff]
line-length = 120
# Generated by Django; left as makemigrations writes them.
extend-exclude = ["netbox_relationships/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
# Django and other libraries first, then NetBox's own apps, then this plugin.
section-order = ["future", "standard-library", "third-party", "netbox", "first-party", "local-folder"]
known-first-party = ["netbox_relationships"]
split-on-trailing-comma = false

[tool.ruff.lint.isort.sections]
netbox = ["circuits", "core", "dcim", "extras", "ipam", "netbox", "tenancy", "users", "utilities", "virtualization", "vpn", "wireless"]
